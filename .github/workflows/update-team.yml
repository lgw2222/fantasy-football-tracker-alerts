name: Update fantasy team

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub runs this roughly every 5-10 minutes
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: fantasy-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull team from ESPN
        continue-on-error: true
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: |
          export SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          python scripts/fetch_team.py

      - name: Live play alerts and clips to Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          export SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          python scripts/live_alerts.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nothing new."
          else
            git commit -m "Update team data"
            git pull --rebase
            git push
          fi
